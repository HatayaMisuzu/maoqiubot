<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>小毛球 Bot 工作台</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./workspace.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="shell">
    <aside id="side" aria-label="工作台导航">
      <div class="brand-bar">
        <div class="brand">
          <span id="mark" aria-hidden="true"></span>
          <span class="brand-name">毛球工作台</span>
        </div>
        <div class="brand-tools">
          <button id="cmd-btn" type="button" class="icon-btn" title="快速切换与搜索 (Ctrl+K)" aria-label="快速切换与搜索"></button>
          <button id="theme-btn" type="button" class="icon-btn" title="切换浅色/深色主题" aria-label="切换浅色/深色主题"></button>
        </div>
      </div>
      <nav id="nav" class="seg-nav" aria-label="工作区"></nav>
      <div id="side-list" class="scroll-sleek"></div>
      <footer id="session"></footer>
    </aside>
    <div id="side-resizer" class="resizer" role="separator" aria-orientation="vertical" aria-label="调整侧边栏宽度" tabindex="0"></div>
    <button id="shade" type="button" aria-label="收起侧栏" hidden></button>
    <div id="stage">
      <main>
        <header class="topbar">
          <button id="menu" type="button" class="icon-btn" aria-label="展开导航" aria-controls="side" aria-expanded="false"></button>
          <div class="heading">
            <div class="heading-row">
              <span id="crumb" class="crumb" hidden></span>
              <h1 id="heading">小毛球</h1>
            </div>
            <small id="subhead"></small>
          </div>
          <div id="tools"></div>
          <button id="inspector-btn" type="button" class="icon-btn" title="展开或收起上下文面板" aria-label="展开或收起上下文面板" aria-controls="inspector" aria-expanded="false" hidden></button>
        </header>
        <div id="status-banner" hidden></div>
        <section id="content" class="scroll-sleek" aria-label="工作区内容"></section>
        <section id="compose" aria-label="撰写消息"></section>
      </main>
      <aside id="inspector" class="scroll-sleek" aria-label="上下文与状态" hidden></aside>
    </div>
  </div>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog" aria-label="工作台操作"></dialog>
  <dialog id="palette" class="palette-dialog" aria-label="快速切换与搜索"></dialog>
</body>
</html>
