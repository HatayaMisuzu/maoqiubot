<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>小毛球 Bot 工作台</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./workspace.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="shell">
    <aside id="side" aria-label="工作台导航">
      <div class="brand"><span id="mark"></span>毛球工作台</div>
      <nav id="nav" aria-label="工作区"></nav>
      <div id="side-list"></div>
      <footer id="session"></footer>
    </aside>
    <button id="shade" aria-label="收起导航" hidden></button>
    <main>
      <header class="topbar">
        <button id="menu" aria-label="展开导航" aria-controls="side" aria-expanded="false"></button>
        <div class="heading"><h1 id="heading">小毛球</h1><small id="subhead"></small></div>
        <div id="tools"></div>
      </header>
      <section id="content" aria-label="工作区内容"></section>
      <section id="compose" aria-label="撰写消息"></section>
    </main>
  </div>
  <div id="notice" role="status" hidden></div>
  <dialog id="dialog" aria-label="工作台操作"></dialog>
</body>
</html>
